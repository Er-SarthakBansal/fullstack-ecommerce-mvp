<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout-Page</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav
      class="fixed h-14 w-full top-0 left-0 z-50 flex justify-between items-center p-3 bg-amber-50 shadow-md md:h-20 lg:h-24">
      <div class="flex items-center">
        <button onclick="history.back()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 mt-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <h1 class="text-2xl font-bold mt-1 pl-3 text-gray-800">Checkout</h1>
      </div>
    </nav>
  </header>
  <main>
    <section class="px-5">
      <h2 class="text-lg font-semibold pt-18">Customer Information</h2>
      <form id="shipping-form" method="post" class="mt-4 space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium">Name:</label>
          <input type="text" name="name" id="name"
            class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 ring-green-400" required>
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium">Phone:</label>
          <input type="tel" name="phone" id="phone"
            class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 ring-green-400" required>
        </div>
        <div>
          <label for="address" class="block text-sm font-medium">Address:</label>
          <input type="text" name="addressLine" id="address"
            class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 ring-green-400" required>
        </div>
        <div>
          <label for="city" class="block text-sm font-medium">City:</label>
          <input type="text" name="city" id="city"
            class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 ring-green-400" required>
        </div>
        <div>
          <label for="pin" class="block text-sm font-medium">Pincode:</label>
          <input type="text" name="pincode" id="pin"
            class="w-full border rounded-lg p-2 mt-1 focus:outline-none focus:ring-2 ring-green-400" required>
        </div>
      </form>
    </section>
    <div class="border-t mt-6 pt-6 px-5"></div>
    <section class="px-5">
      <h2 class="text-lg font-semibold ">Order Summary</h2>
      <div id="order-summary" class="mb-2">
        <!-- Add summary from backend -->
      </div>
    </section>
    <section class="mt-6 px-5">
      <h2 class="text-lg font-semibold mb-2">Payment Method</h2>
      <div class="flex items-center space-x-3">
        <input type="radio" name="paymentMethod" id="cod" class="w-4 h-4" value="Cash On Delivery" form="shipping-form"
          required>
        <label for="cod" class="text-gray-700">Cash on Delivery (COD)</label>
      </div>
    </section>
    <div class="sticky bottom-0 px-4 py-2 bg-white">
      <button id="place-order-btn" form="shipping-form"
        class="w-full bg-green-600 text-white py-3 rounded-lg shadow hover:bg-green-700" type="submit">
        Place Order
      </button>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/checkout.js"></script>
</body>

</html>
