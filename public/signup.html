<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Shri Hari Shringar</title>  
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">

  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Sign Up</h2>

    <form id="signupForm" class="space-y-4">
      <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-lg text-sm" required >

      <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg text-sm" required >

      <button type="submit" class="w-full bg-green-500 text-white p-2 rounded-lg hover:bg-green-600">
        Sign Up
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      Already have an account? <a href="login.html" class="text-blue-500">Login</a>
    </p>
  </div>
  
  <script src="js/config.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
