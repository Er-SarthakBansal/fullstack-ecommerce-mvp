<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav
      class="fixed h-14 w-full top-0 left-0 z-50 flex justify-between items-center p-3 bg-amber-50 shadow-md md:h-20 lg:h-24">
      <div class="flex items-center">
        <button onclick="history.back()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 mt-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <h1 class="text-2xl font-bold mt-1 pl-3 text-gray-800">Shopping Bag</h1>
      </div>
    </nav>
  </header>
  <div id="cart-container" class="p-11 flex flex-col min-h-screen"></div>
  <div id="checkout-area" class="sticky bottom-0 px-4 py-2 bg-white">
    <button id="checkout-btn" class="w-full bg-green-600 text-white py-3 rounded-lg shadow hover:bg-green-700">
      <a href="checkout.html"> Checkout </a>
    </button>
  </div>
  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>

</html>
